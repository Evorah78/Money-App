<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1714" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Personal Loan">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="apple-touch-icon" href="icon.svg?v=1">
<link rel="icon" href="icon.svg?v=1">
<title>Personal Loan</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;--bg:#eef3f0;--card:#fff;--card2:#f7faf8;--text:#18211d;--muted:#718078;--line:#dbe5df;--accent:#7da88f;--accent2:#b8cfc0;--danger:#b35d5d;color-scheme:light}
body.dark{--bg:#0f1714;--card:#17231e;--card2:#1d2a24;--text:#edf4f0;--muted:#9eafa6;--line:#304139;--accent:#8ebba0;--accent2:#6f927e;--danger:#eb8585;color-scheme:dark}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:auto}html,body{margin:0;min-height:100%;width:100%;overflow-x:hidden}body{background:var(--bg);color:var(--text);padding:0 0 env(safe-area-inset-bottom)}button,input,textarea,select{font:inherit}.app{width:100%;max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px 96px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 18px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand img{width:48px;height:48px;border-radius:15px;flex:0 0 auto}.brand h1{margin:0;font-size:24px;line-height:1.05}.brand p{margin:5px 0 0;color:var(--muted);font-size:13px}.iconbtn{width:44px;height:44px;flex:0 0 44px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:800}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:23px}.hero{padding:21px;margin-bottom:14px}.eyebrow{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em}.balance{font-size:39px;font-weight:850;letter-spacing:-1px;margin:7px 0 14px;color:var(--accent)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--card2);border:1px solid var(--line);border-radius:17px;padding:14px}.stat span{display:block;color:var(--muted);font-size:12px}.stat b{display:block;margin-top:5px;font-size:18px}.progress{height:8px;background:var(--line);border-radius:20px;overflow:hidden;margin-top:16px}.progress span{display:block;height:100%;background:var(--accent);border-radius:20px}.progressText{color:var(--muted);font-size:12px;margin-top:8px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.tab{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:12px 5px;border-radius:14px;font-weight:800;font-size:12px}.tab.active{background:var(--text);color:var(--bg);border-color:var(--text)}.card{padding:17px;margin-bottom:12px}.card h2{font-size:18px;margin:0 0 10px}.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row>div:first-child{min-width:0}.row-title{font-weight:800}.row-sub{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35;overflow-wrap:anywhere}.money{font-weight:850;white-space:nowrap}.owed{color:var(--accent)}.paid{color:#6da382}.actions{display:flex;gap:8px;margin-top:8px}.small{border:1px solid var(--line);background:var(--card2);color:var(--text);padding:7px 10px;border-radius:10px;font-size:12px}.danger{color:var(--danger)}.primary,.secondary{width:100%;border-radius:15px;padding:14px 15px;font-weight:850}.primary{border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#102019}.secondary{border:1px solid var(--line);background:var(--card2);color:var(--text)}.hidden{display:none!important}.empty{text-align:center;color:var(--muted);padding:24px 8px}.sheetwrap{position:fixed;inset:0;z-index:50;background:#08110e88;display:flex;align-items:flex-end;padding-top:env(safe-area-inset-top)}.sheet{width:min(680px,100%);margin:0 auto;background:var(--card);border-radius:25px 25px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto;overscroll-behavior:contain}.sheethead{display:flex;justify-content:space-between;align-items:center;gap:12px}.sheethead h3{margin:0}.close{border:0;background:var(--card2);color:var(--text);width:38px;height:38px;border-radius:12px}.field{margin:13px 0}.field label{display:block;color:var(--muted);font-size:12px;font-weight:750;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:14px;padding:13px;outline:none}.field textarea{min-height:78px;resize:vertical}.hint{font-size:11px;color:var(--muted);margin-top:5px}.settings{display:grid;gap:10px}.setting{background:var(--card2);border:1px solid var(--line);border-radius:15px;padding:13px}.setting b{display:block;margin-bottom:8px}.toggle{display:flex;gap:8px}.toggle button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px;border-radius:10px}.toggle button.active{background:var(--text);color:var(--bg)}.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px)}.lockbox{width:min(360px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;text-align:center}.lockbox h2{margin:0 0 6px}.pin{width:100%;text-align:center;letter-spacing:13px;font-size:29px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card2);color:var(--text);margin-top:16px}.pinerr{min-height:20px;color:var(--danger);font-size:13px;margin-top:7px}@media(max-width:390px){.app{padding-left:14px;padding-right:14px}.balance{font-size:35px}.brand h1{font-size:22px}.row{align-items:flex-start}}
</style>
</head>
<body>
<div id="lockScreen" class="lock"><div class="lockbox"><h2>Personal Loan</h2><div class="row-sub">Enter your 4-digit PIN</div><input id="pinEntry" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off"><div id="pinErr" class="pinerr"></div></div></div>
<div class="app">
<header class="top"><div class="brand"><img src="icon.svg?v=1" alt=""><div><h1>Personal Loan</h1><p>Keep what you owe Mo clear</p></div></div><button class="iconbtn" id="settingsBtn" aria-label="Settings">⚙︎</button></header>
<section class="hero"><div class="eyebrow">Outstanding to Mo</div><div class="balance" id="balance">£0.00</div><div class="stats"><div class="stat"><span>Total added</span><b id="totalOwed">£0.00</b></div><div class="stat"><span>Total repaid</span><b id="totalPaid">£0.00</b></div></div><div class="progress"><span id="progress" style="width:0%"></span></div><div class="progressText" id="progressText">0% repaid</div></section>
<div class="tabs"><button class="tab active" data-tab="items">Items owed</button><button class="tab" data-tab="repayments">Repayments</button><button class="tab" data-tab="summary">Summary</button></div>
<section id="itemsTab"></section><section id="repaymentsTab" class="hidden"></section><section id="summaryTab" class="hidden"></section>
</div><div id="sheet" class="sheetwrap hidden"></div>
<script>
const K={data:'mobalance_data_v1',theme:'mobalance_theme_v1',pin:'mobalance_pin_v1'};
const defaults={items:[{id:'i1',title:'PC',amount:1828,date:'',note:'Owed to Mo'}],repayments:[]};
let data=loadData(),activeTab='items';const $=s=>document.querySelector(s);const money=n=>Number(n||0).toLocaleString('en-GB',{style:'currency',currency:'GBP'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function loadData(){try{const v=JSON.parse(localStorage.getItem(K.data));return v&&Array.isArray(v.items)&&Array.isArray(v.repayments)?v:JSON.parse(JSON.stringify(defaults))}catch{return JSON.parse(JSON.stringify(defaults))}}
function save(){localStorage.setItem(K.data,JSON.stringify(data));render()}function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function fmtDate(d){return d?new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'}):'Date not recorded'}
function totals(){const owed=data.items.reduce((a,x)=>a+(+x.amount||0),0),paid=data.repayments.reduce((a,x)=>a+(+x.amount||0),0);return{owed,paid,balance:Math.max(0,owed-paid),pct:owed?Math.min(100,paid/owed*100):0}}
function render(){const t=totals();$('#balance').textContent=money(t.balance);$('#totalOwed').textContent=money(t.owed);$('#totalPaid').textContent=money(t.paid);$('#progress').style.width=t.pct+'%';$('#progressText').textContent=t.pct.toFixed(1)+'% repaid';renderItems();renderRepayments();renderSummary();showTab(activeTab,false)}
function renderItems(){const rows=data.items.map(x=>`<div class="row"><div><div class="row-title">${esc(x.title)}</div><div class="row-sub">${fmtDate(x.date)}${x.note?' · '+esc(x.note):''}</div><div class="actions"><button class="small" onclick="itemSheet('${x.id}')">Edit</button><button class="small danger" onclick="deleteItem('${x.id}')">Delete</button></div></div><div class="money owed">${money(x.amount)}</div></div>`).join('');$('#itemsTab').innerHTML=`<div class="card"><h2>Things you owe Mo for</h2>${rows||'<div class="empty">Nothing owed.</div>'}</div><button class="primary" onclick="itemSheet()">+ Add something you owe</button>`}
function renderRepayments(){const rows=[...data.repayments].sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(x=>`<div class="row"><div><div class="row-title">${fmtDate(x.date)}</div><div class="row-sub">${esc(x.note||'Repayment to Mo')}</div><div class="actions"><button class="small" onclick="repaymentSheet('${x.id}')">Edit</button><button class="small danger" onclick="deleteRepayment('${x.id}')">Delete</button></div></div><div class="money paid">−${money(x.amount)}</div></div>`).join('');$('#repaymentsTab').innerHTML=`<div class="card"><h2>Repayment history</h2>${rows||'<div class="empty">No repayments added yet.</div>'}</div><button class="primary" onclick="repaymentSheet()">+ Add repayment</button>`}
function renderSummary(){const t=totals(),last=[...data.repayments].sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0];$('#summaryTab').innerHTML=`<div class="card"><h2>Summary</h2><div class="row"><div><div class="row-title">Total things added</div><div class="row-sub">${data.items.length} item${data.items.length===1?'':'s'}</div></div><div class="money">${money(t.owed)}</div></div><div class="row"><div><div class="row-title">Paid back</div><div class="row-sub">${data.repayments.length} repayment${data.repayments.length===1?'':'s'}</div></div><div class="money paid">${money(t.paid)}</div></div><div class="row"><div><div class="row-title">Still outstanding</div><div class="row-sub">Automatically updated</div></div><div class="money owed">${money(t.balance)}</div></div><div class="row"><div><div class="row-title">Latest repayment</div><div class="row-sub">${last?fmtDate(last.date):'No repayments yet'}</div></div><div class="money">${last?money(last.amount):'—'}</div></div></div><button class="secondary" onclick="exportBackup()">Export backup</button><div style="height:8px"></div><button class="secondary" onclick="restoreBackup()">Restore backup</button>`}
function showTab(n,remember=true){if(remember)activeTab=n;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===n));['items','repayments','summary'].forEach(x=>$('#'+x+'Tab').classList.toggle('hidden',x!==n))}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
function openSheet(html){$('#sheet').innerHTML=`<div class="sheet">${html}</div>`;$('#sheet').classList.remove('hidden')}function closeSheet(){$('#sheet').classList.add('hidden');$('#sheet').innerHTML=''}
function itemSheet(id){const x=data.items.find(v=>v.id===id)||{title:'',amount:'',date:'',note:''};openSheet(`<div class="sheethead"><h3>${id?'Edit':'Add'} item owed</h3><button class="close" onclick="closeSheet()">×</button></div><div class="field"><label>What do you owe Mo for?</label><input id="itTitle" value="${esc(x.title)}" placeholder="e.g. Monitor, phone, parts"></div><div class="field"><label>Amount</label><input id="itAmount" type="number" inputmode="decimal" min="0" step="0.01" value="${x.amount}"></div><div class="field"><label>Date (optional)</label><input id="itDate" type="date" value="${x.date||''}"></div><div class="field"><label>Notes (optional)</label><textarea id="itNote">${esc(x.note||'')}</textarea></div><button class="primary" onclick="saveItem('${id||''}')">Save item</button>`)}
function saveItem(id){const title=$('#itTitle').value.trim(),amount=+$('#itAmount').value,date=$('#itDate').value,note=$('#itNote').value.trim();if(!title||!(amount>0))return alert('Enter what you owe Mo for and the amount.');if(id)Object.assign(data.items.find(x=>x.id===id),{title,amount,date,note});else data.items.push({id:'i'+Date.now(),title,amount,date,note});save();closeSheet()}function deleteItem(id){if(confirm('Delete this item owed?')){data.items=data.items.filter(x=>x.id!==id);save()}}
function repaymentSheet(id){const x=data.repayments.find(v=>v.id===id)||{amount:'',date:'',note:''};openSheet(`<div class="sheethead"><h3>${id?'Edit':'Add'} repayment</h3><button class="close" onclick="closeSheet()">×</button></div><div class="field"><label>Amount paid to Mo</label><input id="rpAmount" type="number" inputmode="decimal" min="0" step="0.01" value="${x.amount}"></div><div class="field"><label>Payment date (optional)</label><input id="rpDate" type="date" value="${x.date||''}"><div class="hint">Leave blank and today’s date will be saved automatically.</div></div><div class="field"><label>Notes (optional)</label><textarea id="rpNote">${esc(x.note||'')}</textarea></div><button class="primary" onclick="saveRepayment('${id||''}')">Save repayment</button>`)}
function saveRepayment(id){const amount=+$('#rpAmount').value,date=$('#rpDate').value||today(),note=$('#rpNote').value.trim(),t=totals(),old=id?+(data.repayments.find(x=>x.id===id)?.amount||0):0;if(!(amount>0))return alert('Enter the amount you paid.');if(amount>t.balance+old+.005)return alert('That repayment is more than the amount currently owed.');if(id)Object.assign(data.repayments.find(x=>x.id===id),{amount,date,note});else data.repayments.push({id:'r'+Date.now(),amount,date,note});save();closeSheet()}
function deleteRepayment(id){if(confirm('Delete this repayment?')){data.repayments=data.repayments.filter(x=>x.id!==id);save()}}
function applyTheme(v){document.body.classList.toggle('dark',v==='dark');localStorage.setItem(K.theme,v);$('#themeColor').content=v==='dark'?'#0f1714':'#eef3f0'}
function showLock(){if(!localStorage.getItem(K.pin))return;$('#pinEntry').value='';$('#pinErr').textContent='';$('#lockScreen').style.display='flex';resetTop()}function hideLock(){$('#lockScreen').style.display='none';resetTop()}function setPin(){const p=prompt('Enter a new 4-digit PIN');if(p===null)return;if(!/^\d{4}$/.test(p))return alert('PIN must be exactly 4 digits.');localStorage.setItem(K.pin,p);alert('PIN saved.');closeSheet();showLock()}function removePin(){if(confirm('Remove the lock code from Personal Loan?')){localStorage.removeItem(K.pin);closeSheet()}}
$('#pinEntry').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,4);if(e.target.value.length===4){if(e.target.value===localStorage.getItem(K.pin))hideLock();else{$('#pinErr').textContent='Incorrect PIN';e.target.value=''}}});
function settingsSheet(){const t=localStorage.getItem(K.theme)||'dark',hasPin=!!localStorage.getItem(K.pin);openSheet(`<div class="sheethead"><h3>Settings</h3><button class="close" onclick="closeSheet()">×</button></div><div class="settings"><div class="setting"><b>Appearance</b><div class="toggle"><button class="${t==='light'?'active':''}" onclick="applyTheme('light');settingsSheet()">Light</button><button class="${t==='dark'?'active':''}" onclick="applyTheme('dark');settingsSheet()">Dark</button></div></div><div class="setting"><b>4-digit lock code</b><button class="secondary" onclick="setPin()">${hasPin?'Change PIN':'Set PIN'}</button>${hasPin?'<div style="height:8px"></div><button class="secondary" onclick="closeSheet();showLock()">Lock now</button><div style="height:8px"></div><button class="secondary" onclick="removePin()">Remove PIN</button>':''}</div><div class="setting"><div class="row-sub">Your records stay on this device unless you export a backup.</div></div></div>`)}$('#settingsBtn').onclick=settingsSheet;
function exportBackup(){const blob=new Blob([JSON.stringify({app:'Personal Loan',version:3,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='personal-loan-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function restoreBackup(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const b=JSON.parse(r.result);if(!b.data||!Array.isArray(b.data.items)||!Array.isArray(b.data.repayments))throw 0;if(confirm('Replace the current Personal Loan data with this backup?')){data=b.data;save()}}catch{alert('That backup file could not be read.')}};r.readAsText(f)};i.click()}
function resetTop(){history.scrollRestoration='manual';document.documentElement.scrollTop=0;document.body.scrollTop=0;window.scrollTo(0,0);requestAnimationFrame(()=>window.scrollTo(0,0))}
document.addEventListener('visibilitychange',()=>{if(document.hidden)sessionStorage.setItem('mobalance_hidden',Date.now());else{resetTop();if(localStorage.getItem(K.pin)&&Date.now()-(+sessionStorage.getItem('mobalance_hidden')||0)>10000)showLock()}});
window.addEventListener('pageshow',resetTop);window.addEventListener('load',resetTop);
applyTheme(localStorage.getItem(K.theme)||'dark');if(!localStorage.getItem(K.data))localStorage.setItem(K.data,JSON.stringify(defaults));render();resetTop();if(localStorage.getItem(K.pin))showLock();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js?v=3').catch(()=>{});
</script></body></html>
