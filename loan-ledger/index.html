<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111318" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Loan Ledger">
<link rel="manifest" href="manifest.webmanifest?v=1">
<link rel="apple-touch-icon" href="icon.png?v=1">
<link rel="icon" href="icon.png?v=1">
<title>Loan Ledger</title>
<style>
:root{--bg:#f4f3f0;--card:#fff;--card2:#f9f8f5;--text:#17181b;--muted:#76777c;--line:#e6e3dc;--accent:#b7793d;--accent2:#e0b27b;--danger:#a54848;--shadow:0 12px 35px #1c1b1812;color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif}
html[data-theme="dark"]{--bg:#0f1115;--card:#171a20;--card2:#1d2027;--text:#f2f0eb;--muted:#9a9da5;--line:#2a2e36;--accent:#d59555;--accent2:#efbd7f;--danger:#e07171;--shadow:0 16px 45px #0007;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input,select,textarea{font:inherit}.shell{max-width:620px;margin:auto;min-height:100vh;padding:18px 16px 92px}.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 18px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:46px;height:46px;border-radius:14px;box-shadow:var(--shadow)}.brand h1{font-size:22px;margin:0;letter-spacing:-.4px}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--text);width:42px;height:42px;border-radius:14px}.hero{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow);margin-bottom:14px}.label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}.balance{font-size:38px;font-weight:800;letter-spacing:-1.4px;margin:5px 0 14px;color:var(--accent)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:13px}.stat b{display:block;font-size:18px;margin-top:3px}.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:14px}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}.tab{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:11px 4px;border-radius:14px;font-weight:750;font-size:12px}.tab.active{background:var(--text);color:var(--bg);border-color:var(--text)}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:var(--shadow);margin-bottom:12px}.card h2{font-size:17px;margin:0 0 12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row-main{min-width:0}.row-title{font-weight:750}.row-sub{font-size:12px;color:var(--muted);margin-top:3px}.money{font-weight:800;white-space:nowrap}.positive{color:var(--accent)}.negative{color:#4e8a68}.actions{display:flex;gap:7px;margin-top:8px}.smallbtn{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:11px;padding:7px 9px;font-size:12px}.smallbtn.danger{color:var(--danger)}.primary{width:100%;border:0;border-radius:16px;padding:14px 16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#17120e;font-weight:800}.secondary{width:100%;border:1px solid var(--line);border-radius:16px;padding:13px 16px;background:var(--card2);color:var(--text);font-weight:750}.field{margin:11px 0}.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:14px;padding:13px;outline:none}.field textarea{min-height:80px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{text-align:center;color:var(--muted);padding:24px 8px}.hidden{display:none!important}.overlay{position:fixed;inset:0;background:var(--bg);z-index:50;display:grid;place-items:center;padding:22px}.lockcard{width:min(400px,100%);background:var(--card);border:1px solid var(--line);border-radius:26px;padding:26px 20px;box-shadow:var(--shadow);text-align:center}.lockcard img{width:78px;height:78px;border-radius:22px}.lockcard h2{margin:14px 0 4px}.pin{width:100%;text-align:center;letter-spacing:17px;font-size:28px;padding:15px;border:1px solid var(--line);border-radius:16px;background:var(--card2);color:var(--text);margin:15px 0 6px}.error{color:var(--danger);font-size:13px;min-height:20px}.sheetwrap{position:fixed;inset:0;background:#0008;z-index:40;display:flex;align-items:flex-end}.sheet{width:min(620px,100%);max-height:88vh;overflow:auto;margin:auto;background:var(--card);border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom))}.sheethead{display:flex;justify-content:space-between;align-items:center}.sheethead h3{margin:0}.close{border:0;background:var(--card2);color:var(--text);width:36px;height:36px;border-radius:12px}.settings-grid{display:grid;gap:10px}.setting{display:flex;align-items:center;justify-content:space-between;padding:13px;background:var(--card2);border:1px solid var(--line);border-radius:14px}.toggle{display:flex;gap:7px}.toggle button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:7px 10px}.toggle button.active{background:var(--text);color:var(--bg)}
@media(max-width:380px){.balance{font-size:33px}.grid2{grid-template-columns:1fr}.row{align-items:flex-start}}
</style>
</head>
<body>
<div id="lock" class="overlay hidden"></div>
<div class="shell">
<header class="top"><div class="brand"><img src="icon.png?v=1" alt=""><div><h1>Loan Ledger</h1><p>Local repayment tracker</p></div></div><button class="iconbtn" id="settingsBtn" aria-label="Settings">⚙︎</button></header>
<section class="hero"><div class="label">Outstanding balance</div><div class="balance" id="balance">£0.00</div><div class="stats"><div class="stat"><span class="label">Total borrowed</span><b id="borrowed">£0.00</b></div><div class="stat"><span class="label">Total repaid</span><b id="repaid">£0.00</b></div></div><div class="progress"><span id="progress" style="width:0%"></span></div><div class="row-sub" id="progressText" style="margin-top:7px">0% repaid</div></section>
<div class="tabs"><button class="tab active" data-tab="borrowings">Borrowings</button><button class="tab" data-tab="repayments">Repayments</button><button class="tab" data-tab="summary">Summary</button></div>
<section id="borrowingsTab"></section><section id="repaymentsTab" class="hidden"></section><section id="summaryTab" class="hidden"></section>
</div>
<div id="sheet" class="sheetwrap hidden"></div>
<script>
const K={data:'loanledger_data_v1',pin:'loanledger_pin_v1',theme:'loanledger_theme_v1'};
const defaults={borrowings:[
{id:'b1',amount:14600,purpose:'Car TROC',date:''},{id:'b2',amount:560,purpose:'Lyndhurst deposit',date:''},{id:'b3',amount:565,purpose:'Cash at home',date:''},{id:'b4',amount:4400,purpose:'Volvo',date:''},{id:'b5',amount:2850,purpose:'Lyndhurst deposit',date:''},{id:'b6',amount:26000,purpose:'Loan',date:''}],
repayments:[{id:'r1',amount:500,date:'2026-08-28',note:'Payment'}]};
let data=loadData();let activeTab='borrowings';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function loadData(){try{return JSON.parse(localStorage.getItem(K.data))||structuredClone(defaults)}catch{return structuredClone(defaults)}}
function save(){localStorage.setItem(K.data,JSON.stringify(data));render()}
const money=n=>Number(n||0).toLocaleString('en-GB',{style:'currency',currency:'GBP'});const fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'}):'Unknown';
function totals(){const borrowed=data.borrowings.reduce((s,x)=>s+Number(x.amount||0),0),repaid=data.repayments.reduce((s,x)=>s+Number(x.amount||0),0);return{borrowed,repaid,balance:Math.max(0,borrowed-repaid),pct:borrowed?Math.min(100,repaid/borrowed*100):0}}
function render(){const t=totals();$('#balance').textContent=money(t.balance);$('#borrowed').textContent=money(t.borrowed);$('#repaid').textContent=money(t.repaid);$('#progress').style.width=t.pct+'%';$('#progressText').textContent=t.pct.toFixed(2)+'% repaid';renderBorrowings();renderRepayments();renderSummary()}
function renderBorrowings(){const rows=data.borrowings.map(x=>`<div class="row"><div class="row-main"><div class="row-title">${esc(x.purpose)}</div><div class="row-sub">Date borrowed: ${fmtDate(x.date)}</div><div class="actions"><button class="smallbtn" onclick="editBorrowing('${x.id}')">Edit</button><button class="smallbtn danger" onclick="removeBorrowing('${x.id}')">Delete</button></div></div><div class="money positive">${money(x.amount)}</div></div>`).join('');$('#borrowingsTab').innerHTML=`<div class="card"><h2>What the money was used for</h2>${rows||'<div class="empty">No borrowing entries yet.</div>'}</div><button class="primary" onclick="borrowSheet()">+ Add borrowing</button>`}
function renderRepayments(){const list=[...data.repayments].sort((a,b)=>(b.date||'').localeCompare(a.date||''));const rows=list.map(x=>`<div class="row"><div class="row-main"><div class="row-title">${fmtDate(x.date)}</div><div class="row-sub">${esc(x.note||'Repayment')}</div><div class="actions"><button class="smallbtn" onclick="editRepayment('${x.id}')">Edit</button><button class="smallbtn danger" onclick="removeRepayment('${x.id}')">Delete</button></div></div><div class="money negative">−${money(x.amount)}</div></div>`).join('');$('#repaymentsTab').innerHTML=`<div class="card"><h2>Payment history</h2>${rows||'<div class="empty">No repayments recorded.</div>'}</div><button class="primary" onclick="repaymentSheet()">+ Add repayment</button>`}
function renderSummary(){const t=totals(),last=[...data.repayments].sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];$('#summaryTab').innerHTML=`<div class="card"><h2>Loan summary</h2><div class="row"><div><div class="row-title">Original/current borrowing total</div><div class="row-sub">Across ${data.borrowings.length} borrowing entries</div></div><div class="money">${money(t.borrowed)}</div></div><div class="row"><div><div class="row-title">Repaid so far</div><div class="row-sub">Across ${data.repayments.length} payment${data.repayments.length===1?'':'s'}</div></div><div class="money negative">${money(t.repaid)}</div></div><div class="row"><div><div class="row-title">Remaining to repay</div><div class="row-sub">Automatically updated</div></div><div class="money positive">${money(t.balance)}</div></div><div class="row"><div><div class="row-title">Latest payment</div><div class="row-sub">${last?fmtDate(last.date):'No payments yet'}</div></div><div class="money">${last?money(last.amount):'—'}</div></div></div><button class="secondary" onclick="exportBackup()">Export backup</button><div style="height:8px"></div><button class="secondary" onclick="importBackup()">Restore backup</button>`}
function showTab(name){activeTab=name;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));['borrowings','repayments','summary'].forEach(n=>$('#'+n+'Tab').classList.toggle('hidden',n!==name))}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
function openSheet(html){$('#sheet').innerHTML=`<div class="sheet">${html}</div>`;$('#sheet').classList.remove('hidden')};function closeSheet(){$('#sheet').classList.add('hidden');$('#sheet').innerHTML=''}
function borrowSheet(id){const x=data.borrowings.find(v=>v.id===id)||{amount:'',purpose:'',date:''};openSheet(`<div class="sheethead"><h3>${id?'Edit':'Add'} borrowing</h3><button class="close" onclick="closeSheet()">×</button></div><div class="field"><label>Amount borrowed</label><input id="ba" inputmode="decimal" value="${x.amount}"></div><div class="field"><label>What was it for?</label><input id="bp" value="${esc(x.purpose)}"></div><div class="field"><label>Date borrowed (leave blank if unknown)</label><input id="bd" type="date" value="${x.date||''}"></div><button class="primary" onclick="saveBorrowing('${id||''}')">Save borrowing</button>`)}
function saveBorrowing(id){const amount=parseFloat($('#ba').value),purpose=$('#bp').value.trim(),date=$('#bd').value;if(!(amount>0)||!purpose)return alert('Enter an amount and what the money was for.');if(id){Object.assign(data.borrowings.find(x=>x.id===id),{amount,purpose,date})}else data.borrowings.push({id:'b'+Date.now(),amount,purpose,date});save();closeSheet()}
function editBorrowing(id){borrowSheet(id)}function removeBorrowing(id){if(confirm('Delete this borrowing entry?')){data.borrowings=data.borrowings.filter(x=>x.id!==id);save()}}
function repaymentSheet(id){const x=data.repayments.find(v=>v.id===id)||{amount:'',date:new Date().toISOString().slice(0,10),note:''};openSheet(`<div class="sheethead"><h3>${id?'Edit':'Add'} repayment</h3><button class="close" onclick="closeSheet()">×</button></div><div class="field"><label>Amount paid</label><input id="ra" inputmode="decimal" value="${x.amount}"></div><div class="field"><label>Payment date</label><input id="rd" type="date" value="${x.date||''}"></div><div class="field"><label>Note (optional)</label><input id="rn" value="${esc(x.note||'')}"></div><button class="primary" onclick="saveRepayment('${id||''}')">Save repayment</button>`)}
function saveRepayment(id){const amount=parseFloat($('#ra').value),date=$('#rd').value,note=$('#rn').value.trim();if(!(amount>0)||!date)return alert('Enter the payment amount and date.');const t=totals(),old=id?Number(data.repayments.find(x=>x.id===id).amount):0;if(amount>t.balance+old)return alert('That payment is more than the remaining balance.');if(id){Object.assign(data.repayments.find(x=>x.id===id),{amount,date,note})}else data.repayments.push({id:'r'+Date.now(),amount,date,note});save();closeSheet()}
function editRepayment(id){repaymentSheet(id)}function removeRepayment(id){if(confirm('Delete this repayment?')){data.repayments=data.repayments.filter(x=>x.id!==id);save()}}
async function hashPin(pin){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pin));return[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function lockScreen(setup=false){const lock=$('#lock');lock.classList.remove('hidden');lock.innerHTML=`<div class="lockcard"><img src="icon.png?v=1"><h2>${setup?'Create your PIN':'Loan Ledger'}</h2><div class="row-sub">${setup?'Set a 4-digit PIN for this device.':'Enter your 4-digit PIN.'}</div><input id="pin" class="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" type="password" autocomplete="off" placeholder="••••"><div id="pinErr" class="error"></div></div>`;setTimeout(()=>$('#pin').focus(),50);$('#pin').addEventListener('input',async e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,4);if(e.target.value.length===4){const h=await hashPin(e.target.value);if(setup){localStorage.setItem(K.pin,h);unlock()}else if(h===localStorage.getItem(K.pin)){unlock()}else{$('#pinErr').textContent='Incorrect PIN';e.target.value='';navigator.vibrate?.(80)}}})}
function unlock(){$('#lock').classList.add('hidden');$('#lock').innerHTML=''}
function applyTheme(v){document.documentElement.dataset.theme=v;localStorage.setItem(K.theme,v);$('#themeColor').setAttribute('content',v==='dark'?'#0f1115':'#f4f3f0')}
function settingsSheet(){const theme=localStorage.getItem(K.theme)||'dark';openSheet(`<div class="sheethead"><h3>Settings</h3><button class="close" onclick="closeSheet()">×</button></div><div class="settings-grid"><div class="setting"><div><b>Theme</b><div class="row-sub">Light or dark</div></div><div class="toggle"><button class="${theme==='light'?'active':''}" onclick="applyTheme('light');settingsSheet()">Light</button><button class="${theme==='dark'?'active':''}" onclick="applyTheme('dark');settingsSheet()">Dark</button></div></div><button class="secondary" onclick="changePin()">Change 4-digit PIN</button><button class="secondary" onclick="lockNow()">Lock now</button></div>`)}
function changePin(){if(!confirm('Set a new 4-digit PIN?'))return;localStorage.removeItem(K.pin);closeSheet();lockScreen(true)}function lockNow(){closeSheet();lockScreen(false)}
$('#settingsBtn').onclick=settingsSheet;
function exportBackup(){const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='loan-ledger-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function importBackup(){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.data?.borrowings||!j.data?.repayments)throw 0;if(confirm('Replace the current Loan Ledger data with this backup?')){data=j.data;save()}}catch{alert('That backup file could not be read.')}};r.readAsText(f)};inp.click()}
applyTheme(localStorage.getItem(K.theme)||'dark');if(!localStorage.getItem(K.data))localStorage.setItem(K.data,JSON.stringify(defaults));render();if(!localStorage.getItem(K.pin))lockScreen(true);else lockScreen(false);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&localStorage.getItem(K.pin))setTimeout(()=>{if(document.hidden)lockScreen(false)},300)});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js?v=1').catch(()=>{});
</script>
</body>
</html>
